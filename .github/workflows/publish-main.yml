name: Publish accepted main milestone
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Approved version tag, for example v0.0.2.
        type: string
        required: true
      commit:
        description: Full accepted main commit SHA to release.
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: release-refs/tags/${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Approve main commit and create version tag
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.prepare.outputs.tag }}
      commit: ${{ steps.prepare.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Refresh accepted main history
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
      - name: Verify explicit approval and create annotated tag
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_TAG: ${{ inputs.tag }}
          APPROVED_COMMIT: ${{ inputs.commit }}
        run: python tools/prepare_release.py --tag "$APPROVED_TAG" --commit "$APPROVED_COMMIT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: explicit-release-approval
          path: reports/tag-approval.json
          if-no-files-found: warn
          retention-days: 14

  gates:
    needs: prepare
    uses: ./.github/workflows/release-gates.yml
    with:
      tag: ${{ needs.prepare.outputs.tag }}
      source-ref: ${{ needs.prepare.outputs.commit }}
      dry-run: false

  publish:
    name: Publish verified assets
    needs: [prepare, gates]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: release-tooling
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          path: release-source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Refresh main history before publication
        working-directory: release-source
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets-${{ github.sha }}
          path: release-source/build/release-assets
      - name: Stage draft, verify uploaded assets, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          APPROVED_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: >-
          python release-tooling/tools/publish_release.py --tag "$RELEASE_TAG"
          --approved-commit "$APPROVED_COMMIT" --source-root release-source
          --input release-source/build/release-assets
