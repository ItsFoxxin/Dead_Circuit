name: Setup Dead Circuit
description: Install the pinned Python, Godot and GUT toolchain.
inputs:
  templates:
    description: Install development export templates.
    default: 'false'
runs:
  using: composite
  steps:
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: tools/requirements-dev.txt
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: .tools/downloads
        key: toolchain-${{ runner.os }}-${{ inputs.templates }}-${{ hashFiles('tools/toolchain.json') }}
    - shell: bash
      run: python -m pip install -r tools/requirements-dev.txt
    - if: inputs.templates != 'true'
      shell: bash
      run: python tools/bootstrap.py
    - if: inputs.templates == 'true'
      shell: bash
      run: python tools/bootstrap.py --templates
